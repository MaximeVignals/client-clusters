<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Client Clusters</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="phone.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/map.css">
<script src="js/size.js"></script>
</head>
<body data-mode="loading">
<!-- Icons: 24px grid, 2px stroke, round caps. Referenced with <use href="#id">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.95 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 17 18z"/><path d="M3 3l18 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-3.5M4 4v4h4M4 13a8 8 0 0 0 14.5 3.5M20 20v-4h-4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1.5 1.5 0 0 1-1.5 1.5A16 16 0 0 1 3.5 5.5 1.5 1.5 0 0 1 5 4z"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 3l8 18-8-4.5L4 21z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></symbol>
    <!-- prospect status glyphs: à contacter, visité, converti, pas intéressé -->
    <symbol id="s-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5"/></symbol>
    <symbol id="s-visited" viewBox="0 0 24 24"><path d="M5.5 12.5l4.5 4.5 8.5-9.5"/></symbol>
    <symbol id="s-converted" viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17.3l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></symbol>
    <symbol id="s-no" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <!-- priority: A full disc, B half disc, C ring -->
    <symbol id="p-a" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></symbol>
    <symbol id="p-b" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="p-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
  </defs>
</svg>

<header id="top" data-region="appbar">
  <button id="back" class="icon-btn" data-act="back" aria-label="Retour" hidden><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-back"/></svg></button>
  <h1 id="title">Client Clusters</h1>
  <button id="chip" class="pill" data-act="sync-now" hidden></button>
</header>
<!-- DOM order = tab order. Medium/expanded: rail, list, "Noter une visite", detail, map, actions. Compact: app.js moves the
     navigation to the end of the body (it is fixed at the bottom there). -->
<nav id="tabs" aria-label="Navigation principale">
  <button data-act="tab" data-tab="today"><span class="ti"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-today"/></svg></span><span class="tl">Aujourd’hui</span></button>
  <button data-act="tab" data-tab="map"><span class="ti"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-map"/></svg></span><span class="tl">Carte</span></button>
  <button data-act="tab" data-tab="prospects"><span class="ti"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-flag"/></svg></span><span class="tl">Prospects</span></button>
  <button data-act="tab" data-tab="settings"><span class="ti"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg></span><span class="tl">Réglages</span></button>
</nav>
<!-- Start-up skeleton: replaced by the first render (app.js removes aria-busy). No shimmer under reduced motion (tokens.css). -->
<main id="view" data-region="list" tabindex="-1" aria-busy="true"><div class="skel" aria-hidden="true"><i class="skel-h"></i><i></i><i></i><i></i><i></i></div><p class="sr">Chargement…</p></main>
<div id="fab" data-region="fab" hidden></div>
<section id="detail" data-region="detail" aria-label="Détail" aria-labelledby="detail-title" tabindex="-1" hidden></section>
<section id="mapview" data-region="map" hidden>
  <div id="map"></div>
  <div id="maptools" role="group" aria-label="Filtres de la carte"></div>
  <!-- short notes over the map, not live regions: why the "today" filter locks other chips, and the offline background -->
  <div id="mapnotes"><p id="mf-help" class="map-note" hidden></p><p id="mapchip" class="map-note" hidden></p></div>
  <div id="mapempty" class="map-empty" hidden></div>
  <!-- "Sur la carte" bottom sheet (compact and medium Carte); wider windows show the same list in the list pane -->
  <div id="msheet" class="msheet" data-state="peek">
    <button type="button" id="msheet-handle" class="msheet-handle" data-act="os-toggle" aria-expanded="false" aria-controls="os-list"><span class="msheet-grab" aria-hidden="true"></span><span id="os-count" class="msheet-count">Sur la carte</span></button>
    <div id="os-list" class="os-list" role="region" aria-label="Sur la carte" inert></div>
  </div>
</section>
<div id="actions" data-region="actions" hidden></div>
<div id="sheet" data-region="sheet" hidden></div>
<div id="sync-live" class="sr" role="status" aria-live="polite"></div>
<div id="os-live" class="sr" role="status" aria-live="polite"></div>
<div id="snackbar" role="status" aria-live="polite"><div id="toast" hidden></div></div>
<div id="modal" hidden></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="lib/visits.js"></script>
<script src="lib/cluster.js"></script>
<script src="lib/hours.js"></script>
<script src="lib/planning.js"></script>
<script src="lib/sync-model.js"></script>
<script src="lib/sync-ops.js"></script>
<script src="lib/sync-crypto.js"></script>
<script src="lib/sync-engine.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="dev/demo.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/views.js"></script>
<script src="js/mapkit.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
