<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Client Clusters</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="phone.css">
</head>
<body data-mode="loading">
<header id="top">
  <button id="back" class="icon" data-act="back" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">Client Clusters</h1>
  <button id="chip" class="chip" data-act="sync-now" aria-live="polite" hidden></button>
</header>
<main id="view" aria-live="polite"></main>
<section id="mapview" hidden>
  <div id="map"></div>
  <div id="maptools"><label class="toggle"><input type="checkbox" id="show-prospects"> Prospects</label></div>
</section>
<nav id="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today"><span class="ti">&#9733;</span>Today</button>
  <button data-act="tab" data-tab="map"><span class="ti">&#9906;</span>Map</button>
  <button data-act="tab" data-tab="prospects"><span class="ti">&#9873;</span>Prospects</button>
  <button data-act="tab" data-tab="settings"><span class="ti">&#9881;</span>Settings</button>
</nav>
<div id="toast" role="status" hidden></div>
<div id="modal" hidden></div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/visits.js"></script>
<script src="lib/cluster.js"></script>
<script src="lib/hours.js"></script>
<script src="lib/planning.js"></script>
<script src="lib/sync-model.js"></script>
<script src="lib/sync-ops.js"></script>
<script src="lib/sync-crypto.js"></script>
<script src="lib/sync-engine.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/views.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
